name: Website release

on:
  push:
    branches: [main]
    paths:
      - index.html
      - .github/workflows/release.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Publish the website version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PROMPT_DISABLED: '1'
        shell: bash
        run: |
          tag="$(
            gh api "repos/$GITHUB_REPOSITORY/contents/index.html?ref=$GITHUB_SHA" --jq .content |
              base64 --decode |
              sed -nE 's/^[[:space:]]*<span>(v[0-9]+\.[0-9]+\.[0-9]+)<\/span>[[:space:]]*$/\1/p'
          )"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf '%s\n' 'Expected one version in index.html, such as v1.0.0.' >&2
            exit 1
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            exit 0
          fi
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Service Desk Central $tag" --notes ''
